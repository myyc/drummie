app-id: dev.myyc.drummie
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
command: drummie
finish-args:
  # Audio playback
  - --socket=pulseaudio
  # X11 + XShm access
  - --socket=x11
  - --share=ipc
  # Wayland access
  - --socket=wayland
  # OpenGL access for Flutter rendering
  - --device=dri
  # PipeWire socket access for modern audio
  - --filesystem=xdg-run/pipewire-0:ro

modules:
  - name: drummie
    buildsystem: simple
    sources:
      - type: dir
        path: .
        skip:
          - .git
          - .dart_tool
          - .idea
          - .claude
          - "*.md"
          - lib
          - test
          - macos
          - "*.yaml"
          - "*.yml"
    build-commands:
      # Verify the app was pre-built
      - test -f build/linux/x64/release/bundle/drummie || (echo "Error: Run 'flutter build linux --release' first" && exit 1)

      # Install the binary to /app/bin
      - install -Dm755 build/linux/x64/release/bundle/drummie /app/bin/drummie

      # Copy lib and data directories
      - cp -r build/linux/x64/release/bundle/lib /app/bin/
      - cp -r build/linux/x64/release/bundle/data /app/bin/

      # Install desktop file
      - install -Dm644 linux/drummie.desktop /app/share/applications/dev.myyc.drummie.desktop

      # Install icons
      - install -Dm644 linux/icons/dev.myyc.drummie-16.png /app/share/icons/hicolor/16x16/apps/dev.myyc.drummie.png
      - install -Dm644 linux/icons/dev.myyc.drummie-24.png /app/share/icons/hicolor/24x24/apps/dev.myyc.drummie.png
      - install -Dm644 linux/icons/dev.myyc.drummie-32.png /app/share/icons/hicolor/32x32/apps/dev.myyc.drummie.png
      - install -Dm644 linux/icons/dev.myyc.drummie-48.png /app/share/icons/hicolor/48x48/apps/dev.myyc.drummie.png
      - install -Dm644 linux/icons/dev.myyc.drummie-64.png /app/share/icons/hicolor/64x64/apps/dev.myyc.drummie.png
      - install -Dm644 linux/icons/dev.myyc.drummie-128.png /app/share/icons/hicolor/128x128/apps/dev.myyc.drummie.png
      - install -Dm644 linux/icons/dev.myyc.drummie-256.png /app/share/icons/hicolor/256x256/apps/dev.myyc.drummie.png
      - install -Dm644 linux/icons/dev.myyc.drummie-512.png /app/share/icons/hicolor/512x512/apps/dev.myyc.drummie.png
      - install -Dm644 drummie.svg /app/share/icons/hicolor/scalable/apps/dev.myyc.drummie.svg

      # Install AppStream metadata
      - install -Dm644 linux/dev.myyc.drummie.metainfo.xml /app/share/metainfo/dev.myyc.drummie.metainfo.xml
